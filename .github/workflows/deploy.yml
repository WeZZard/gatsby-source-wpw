name: CI and Trigger MyWorks Deployment

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    name: Typecheck and unit test @wezzard/wpw
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test

  dispatch-myworks:
    name: Dispatch MyWorks Cloudflare Workers deployment
    needs: test-and-build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger WeZZard/MyWorks deploy.yml
        env:
          DISPATCH_TOKEN: ${{ secrets.MYWORKS_DISPATCH_TOKEN || secrets.GH_PAT }}
        run: |
          if [ -z "${DISPATCH_TOKEN}" ]; then
            echo "Skipping dispatch: neither MYWORKS_DISPATCH_TOKEN nor GH_PAT is set in this repository."
            exit 0
          fi
          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/WeZZard/MyWorks/actions/workflows/deploy.yml/dispatches \
            -d '{"ref":"main"}'
